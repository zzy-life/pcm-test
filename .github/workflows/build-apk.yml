name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 新版 Android SDK 命令行工具要求 JDK 17 或更高版本。
      - name: Set up Java 17 for Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 覆盖默认 tools platform-tools，避免安装已下架的旧 tools 包。
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-31' 'build-tools;30.0.3'

      # SDK 安装完成后切回 JDK 11，保持现有 Android Gradle Plugin 构建环境。
      - name: Set up Java 11 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # 不调用指向本机 D 盘的 gradlew，由 Actions 安装相同版本。
      - name: Set up Gradle 7.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5'

      # 从环境变量写入配置，避免将密钥直接拼接进 shell 命令。
      - name: Configure application
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          AGENTS_CAREER_API_KEY: ${{ secrets.AGENTS_CAREER_API_KEY }}
          AGENTS_RESUME_DIAGNOSIS_API_KEY: ${{ secrets.AGENTS_RESUME_DIAGNOSIS_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          properties = {
              'api.base.url': os.environ.get('API_BASE_URL') or 'http://xxx',
              'agents.career.api.key': os.environ.get('AGENTS_CAREER_API_KEY', ''),
              'agents.resume.diagnosis.api.key': os.environ.get('AGENTS_RESUME_DIAGNOSIS_API_KEY', ''),
          }
          # Properties.load 使用 ISO-8859-1，非 ASCII 字符需使用 Unicode 转义。
          def escape(value):
              return json.dumps(value, ensure_ascii=True)[1:-1].replace(' ', '\\ ')

          Path('local.properties').write_text(
              ''.join(f'{key}={escape(value)}\n' for key, value in properties.items()),
              encoding='utf-8',
          )
          PY

      # Debug APK 自带调试签名，可直接安装；无需上传正式签名证书。
      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hrRobot-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/hrRobot.apk
          if-no-files-found: error
          retention-days: 14
