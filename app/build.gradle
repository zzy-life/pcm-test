apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
// 机器人与电脑同网段时，可在 local.properties 设置 api.base.url=http://电脑IP:8610/jqrserv/api
def apiBaseUrl = localProps.getProperty('api.base.url', 'http://xxx')
// 内部演示配置：密钥会进入 APK，正式分发应通过后端代理调用。
def javaString = { String value -> groovy.json.JsonOutput.toJson(value) }
def careerKey = localProps.getProperty('agents.career.api.key', '')
def diagnosisKey = localProps.getProperty('agents.resume.diagnosis.api.key', '')
def optimizationKey = localProps.getProperty('agents.resume.optimization.api.key', '')
def interviewKey = localProps.getProperty('agents.mock.interview.api.key', '')

android {
    // android-pdf-viewer 传递依赖 androidx.core:1.7.0 要求 compileSdk ≥ 31
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.hr.digitalhuman"
        // android-pdf-viewer(mhiew) 要求 minSdk ≥ 19
        minSdkVersion 19
        targetSdkVersion 29
        versionCode 3
        versionName "2.0.0"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
        buildConfigField "String", "AGENTS_CAREER_API_KEY", javaString(careerKey)
        buildConfigField "String", "AGENTS_RESUME_DIAGNOSIS_API_KEY", javaString(diagnosisKey)
        buildConfigField "String", "AGENTS_RESUME_OPTIMIZATION_API_KEY", javaString(optimizationKey)
        buildConfigField "String", "AGENTS_MOCK_INTERVIEW_API_KEY", javaString(interviewKey)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            // 猎户星空机器人多为 arm；裁剪 abi 减小包体
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'lib/**/libc++_shared.so'
        pickFirst 'lib/**/libjnidispatch.so'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all {
        variant->variant.outputs.all {
            output->outputFileName = "hrRobot.apk"
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/robotservice.jar')
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.zxing:core:3.3.3'
    // 原生 Markdown 渲染：标题、列表、引用、代码块、表格及删除线。
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    // 简历 PDF 本机预览（Pdfium）
    implementation 'com.github.mhiew:android-pdf-viewer:3.2.0-beta.3'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.5.2"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2"
    testImplementation 'junit:junit:4.12'
}
