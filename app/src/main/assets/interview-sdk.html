<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>数字人面试</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0A1E3C;color:#F4F7FB;font-family:sans-serif}
#setup{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.actions{display:flex;gap:12px}
button{border:1px solid transparent;border-radius:8px;padding:14px 24px;background:#1B6BDB;color:#F4F7FB;font-size:18px}
button:disabled{opacity:.4}
#skip{background:#122B4A;border-color:#4A6070;color:#9BB0C9}
#status{max-width:80%;text-align:center;color:#9BB0C9;white-space:pre-line}
#modal-container.active{position:fixed;inset:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="setup"><div id="status">正在加载面试服务…</div><div class="actions"><button id="start" disabled>检测设备并开始面试</button><button id="skip" disabled>跳过检测（测试）</button></div></div>
<div id="modal-container">
  <pcm-mnms-modal
    id="pcm-mnms-modal-video"
    modal-title="数字人面试"
    conversation-id=""
    fullscreen="true"
    digital-id="79597885440"
    enable-virtual-human="true"
    interview-mode="video"
    show-end-interview-button="true"
    default-query="请开始模拟面试"
  ></pcm-mnms-modal>
</div>
<script>
'use strict';
let component = document.getElementById('pcm-mnms-modal-video');
let testStream = null, completed = false, starting = false, configured = false;
let config = null;
// 在 SDK 模块加载前适配 getUserMedia；仅音频走原生 MIC，摄像头保留浏览器实现。
const browserGetUserMedia = navigator.mediaDevices && navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
let nativeAudio = null, mediaQueue = Promise.resolve();
function closeNativeAudio(session) {
  if (!session || session.closed) return;
  session.closed = true;
  if (session.cancelStart) {
    session.cancelStart(new Error('麦克风采集已停止'));
    session.cancelStart = null;
  }
  clearInterval(session.timer);
  session.tracks.forEach(track => track.stop());
  session.destination.stream.getTracks().forEach(track => track.stop());
  session.context.close().catch(() => {});
  InterviewHost.stopMicrophone();
  if (nativeAudio === session) nativeAudio = null;
}
async function nativeAudioTrack() {
  let session = nativeAudio;
  if (!session) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) throw new Error('当前 WebView 不支持音频转换');
    const context = new AudioContextClass();
    session = {context, destination:context.createMediaStreamDestination(), tracks:new Set(), closed:false, nextTime:0};
    nativeAudio = session;
    try {
      await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('音频启动超时，请点击重试')), 5000);
        session.cancelStart = reject;
        context.resume().then(resolve, reject).finally(() => clearTimeout(timeout));
      });
      session.cancelStart = null;
      if (context.state !== 'running') throw new Error('音频未启动，请点击重试');
      if (completed) throw new Error('面试已结束');
      const message = InterviewHost.startMicrophone();
      if (message) throw new Error(message);
      // 收到真实 PCM 才算设备启动成功，避免仅创建空音轨就通过检测。
      await new Promise((resolve, reject) => {
        let received = false, lastFrameAt = Date.now();
        session.cancelStart = reject;
        session.timer = setInterval(() => {
          try {
            if (session.closed || completed) throw new Error('麦克风采集已停止');
            if (context.state !== 'running') throw new Error('音频处理已中断，请重新进入面试');
            for (let i = 0; i < 8; i++) {
              const encoded = InterviewHost.readMicrophone();
              if (!encoded) break;
              if (encoded[0] === '!') throw new Error(encoded.slice(1));
              const bytes = atob(encoded);
              const buffer = context.createBuffer(1, bytes.length / 2, 16000);
              const samples = buffer.getChannelData(0);
              for (let j = 0; j < samples.length; j++) {
                const value = bytes.charCodeAt(j * 2) | (bytes.charCodeAt(j * 2 + 1) << 8);
                samples[j] = (value >= 32768 ? value - 65536 : value) / 32768;
              }
              // 只连接录制音轨，不连接扬声器，避免本地回放啸叫。
              const source = context.createBufferSource();
              source.buffer = buffer;
              source.connect(session.destination);
              source.onended = () => source.disconnect();
              session.nextTime = Math.max(session.nextTime, context.currentTime + 0.02);
              source.start(session.nextTime);
              session.nextTime += buffer.duration;
              lastFrameAt = Date.now();
              if (!received) { received = true; session.cancelStart = null; resolve(); }
            }
            if (Date.now() - lastFrameAt > 5000) throw new Error('未收到麦克风音频，请重试');
          } catch (error) {
            if (!received) {
              closeNativeAudio(session);
              reject(error);
            } else {
              // 录制期间只记录检测结果，不结束音轨或接管 SDK 的面试流程。
              if (!session.audioWarningLogged) {
                console.warn('麦克风音频异常', error);
                session.audioWarningLogged = true;
              }
            }
          }
        }, 20);
      });
    } catch (error) {
      closeNativeAudio(session);
      throw error;
    }
  }
  // SDK 每题会 stop()，按轨道计数释放；并发申请不能互相关闭麦克风。
  function retain(track) {
    const stop = track.stop.bind(track), clone = track.clone.bind(track);
    session.tracks.add(track);
    track.stop = () => {
      if (!session.tracks.delete(track)) return;
      stop();
      if (!session.tracks.size) closeNativeAudio(session);
    };
    track.clone = () => retain(clone());
    return track;
  }
  if (completed || session.closed) throw new Error('麦克风采集已停止');
  return retain(session.destination.stream.getAudioTracks()[0].clone());
}
if (browserGetUserMedia) {
  navigator.mediaDevices.getUserMedia = function(constraints) {
    if (!constraints || !constraints.audio) return browserGetUserMedia(constraints);
    const request = mediaQueue.then(async () => {
      if (completed) throw new Error('面试已结束');
      let videoStream = null, audioTrack = null;
      try {
        if (constraints.video) videoStream = await browserGetUserMedia({video:constraints.video, audio:false});
        if (completed) throw new Error('面试已结束');
        audioTrack = await nativeAudioTrack();
        if (completed) throw new Error('面试已结束');
        return new MediaStream([...(videoStream ? videoStream.getVideoTracks() : []), audioTrack]);
      } catch (error) {
        if (videoStream) videoStream.getTracks().forEach(track => track.stop());
        if (audioTrack) audioTrack.stop();
        throw error;
      }
    });
    mediaQueue = request.catch(() => {});
    return request;
  };
}
const status = document.getElementById('status');
const start = document.getElementById('start');
const skip = document.getElementById('skip');
const container = document.getElementById('modal-container');
function notify(type, id) { InterviewHost.event(type, id || ''); }
function stopMedia() {
  if (testStream) { testStream.getTracks().forEach(t => t.stop()); testStream = null; }
}
function dispose() {
  completed = true;
  stopMedia();
  closeNativeAudio(nativeAudio);
  const old = component;
  component = null;
  if (old) { old.isOpen = false; old.remove(); }
  container.classList.remove('active');
}
window.initializeInterview = async function(value) {
  config = value;
  await customElements.whenDefined('pcm-mnms-modal');
  component.setAttribute('token', config.token);
  if (!configured) {
    component.addEventListener('conversationStart', e => {
      component.setAttribute('conversation-id', e.detail.conversation_id);
      notify('conversation', e.detail.conversation_id);
    });
    component.addEventListener('streamComplete', e => notify('conversation', e.detail.conversation_id));
    component.addEventListener('tokenInvalid', () => notify('tokenInvalid'));
    component.addEventListener('interviewComplete', e => {
      if (completed) return;
      completed = true;
      const id = e.detail && e.detail.conversation_id;
      dispose();
      notify('complete', id);
    });
    component.addEventListener('modalClosed', () => {
      if (completed) return;
      completed = true;
      dispose();
      notify('closed');
    });
    // SDK 自行处理录制和业务错误，宿主页不因此关闭面试或切换错误页。
    ['recordingError','someErrorEvent'].forEach(type => component.addEventListener(type, e => {
      console.warn('面试 SDK 事件：' + type, e.detail);
    }));
    configured = true;
  }
  status.textContent = '请确认摄像头和麦克风可用';
  start.disabled = false;
  skip.disabled = false;
  notify('ready');
};
window.updateInterviewToken = function(token) {
  if (component) component.setAttribute('token', token);
  if (config) config.token = token;
};
function describeDeviceError(error) {
  const name = error.name || 'UnknownError';
  if (name === 'NotAllowedError' || name === 'PermissionDeniedError') return '未获得访问权限（' + name + '）';
  if (name === 'NotFoundError' || name === 'DevicesNotFoundError') return '未找到可用设备（' + name + '）';
  if (name === 'NotReadableError' || name === 'TrackStartError') return '已允许访问，但设备无法启动，可能被系统服务占用（' + name + '）';
  return error.message || '检测失败（' + name + '）';
}
async function checkDevices() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    throw new Error('当前系统 WebView 不支持音视频采集，请更新系统 WebView');
  }
  const results = [], failures = [];
  // 分别检测，避免将摄像头启动失败误报为麦克风问题，或反之。
  for (const device of [
    {name:'麦克风', constraints:{audio:true,video:false}},
    {name:'摄像头', constraints:{audio:false,video:true}}
  ]) {
    status.textContent = results.concat('正在检测' + device.name + '…').join('\n');
    try {
      testStream = await navigator.mediaDevices.getUserMedia(device.constraints);
      results.push(device.name + '：可用');
    } catch (error) {
      const message = device.name + '：' + describeDeviceError(error);
      results.push(message);
      failures.push(message);
    } finally {
      stopMedia();
    }
  }
  if (failures.length) throw new Error(results.join('\n') + '\n可重试，或跳过检测进行测试');
  // 单路可用不代表音视频能够同时开启，最后验证 SDK 所需的组合。
  status.textContent = '正在检测音视频同时采集…';
  try {
    testStream = await navigator.mediaDevices.getUserMedia({audio:true,video:true});
  } catch (error) {
    throw new Error('麦克风、摄像头单独可用，但同时采集失败：' + describeDeviceError(error));
  } finally {
    stopMedia();
  }
}
async function beginInterview(skipCheck) {
  if (starting || completed) return;
  starting = true;
  start.disabled = true;
  skip.disabled = true;
  try {
    if (!skipCheck) await checkDevices();
    // 与官方示例一致，使用静态组件；参数在用户开始时设置，避免提前启动业务。
    component.customInputs = config.inputs;
    container.classList.add('active');
    document.getElementById('setup').style.display = 'none';
    component.isOpen = true;
  } catch (error) {
    stopMedia();
    container.classList.remove('active');
    document.getElementById('setup').style.display = 'flex';
    status.textContent = error.message || describeDeviceError(error);
    start.disabled = false;
    skip.disabled = false;
    starting = false;
  }
}
start.onclick = () => beginInterview(false);
skip.onclick = () => beginInterview(true);
window.addEventListener('pagehide', dispose);
</script>
<script type="module" src="https://pub.pincaimao.com/sdk/js/pcm-agents@latest/dist/pcm-agents/pcm-agents.esm.js" onerror="notify('loadError')"></script>
</body>
</html>
